---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - wget
      - vim
      - git
      - jq
      - htop
      - unzip
      - tar
      - bash-completion
      - software-properties-common
    state: present
